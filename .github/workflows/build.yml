name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE.md"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
  workflow_dispatch:

# never run two releases at the same time, they would pick the same patch number
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for version + changelog

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: info
        run: bash .github/scripts/release-info.sh "$RUNNER_TEMP/CHANGELOG.md"

      - name: Build
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="${{ steps.info.outputs.version }}-pr.${{ github.event.number }}"
          else
            version="${{ steps.info.outputs.version }}"
          fi
          echo "Building $version"
          ./gradlew build -PpluginVersion="$version" --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: JEIPaperBridge
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.info.outputs.released != 'true' && steps.info.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          cat "$RUNNER_TEMP/CHANGELOG.md"
          gh release create "$TAG" build/libs/JEIPaperBridge-"$VERSION".jar \
            --target "$GITHUB_SHA" \
            --title "JEIPaperBridge $VERSION" \
            --notes-file "$RUNNER_TEMP/CHANGELOG.md"

      - name: Publish to Modrinth
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.info.outputs.released != 'true' && steps.info.outputs.relevant == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: bZunXXBE
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "::warning::MODRINTH_TOKEN is not set, skipping Modrinth upload"
            exit 0
          fi
          mc_version=$(sed -n 's/^minecraftVersion=//p' gradle.properties | tr -d '[:space:]')
          jq -n \
            --arg project "$MODRINTH_PROJECT" \
            --arg version "$VERSION" \
            --arg mc "$mc_version" \
            --rawfile changelog "$RUNNER_TEMP/CHANGELOG.md" \
            '{
              project_id: $project,
              name: "JEIPaperBridge \($version)",
              version_number: $version,
              changelog: $changelog,
              game_versions: [$mc],
              loaders: ["paper", "purpur"],
              version_type: "release",
              featured: true,
              dependencies: [],
              file_parts: ["file"],
              primary_file: "file"
            }' > "$RUNNER_TEMP/modrinth.json"
          curl --fail-with-body -sS https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: MaxXLive/jei-paper-bridge (github.com/MaxXLive/jei-paper-bridge)" \
            -F "data=<$RUNNER_TEMP/modrinth.json;type=application/json" \
            -F "file=@build/libs/JEIPaperBridge-$VERSION.jar;type=application/java-archive"

      - name: Publish to Hangar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.info.outputs.released != 'true' && steps.info.outputs.relevant == 'true'
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_PROJECT: MaxXLive/JEIPaperBridge
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [[ -z "$HANGAR_API_TOKEN" ]]; then
            echo "::warning::HANGAR_API_TOKEN is not set, skipping Hangar upload"
            exit 0
          fi
          mc_version=$(sed -n 's/^minecraftVersion=//p' gradle.properties | tr -d '[:space:]')
          # the API key is exchanged for a short-lived JWT
          jwt=$(curl --fail-with-body -sS -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | jq -r .token)
          echo "::add-mask::$jwt"
          jq -n \
            --arg version "$VERSION" \
            --arg mc "$mc_version" \
            --rawfile changelog "$RUNNER_TEMP/CHANGELOG.md" \
            '{
              version: $version,
              channel: "Release",
              description: $changelog,
              platformDependencies: {PAPER: [$mc]},
              pluginDependencies: {},
              files: [{platforms: ["PAPER"]}]
            }' > "$RUNNER_TEMP/hangar.json"
          curl --fail-with-body -sS "https://hangar.papermc.io/api/v1/projects/$HANGAR_PROJECT/upload" \
            -H "Authorization: $jwt" \
            -H "User-Agent: MaxXLive/jei-paper-bridge (github.com/MaxXLive/jei-paper-bridge)" \
            -F "versionUpload=<$RUNNER_TEMP/hangar.json;type=application/json" \
            -F "files=@build/libs/JEIPaperBridge-$VERSION.jar;type=application/java-archive"
